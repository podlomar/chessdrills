<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.1; }
      50%       { opacity: 0.4; }
    }
    .shimmer { animation: pulse 1.6s ease-in-out infinite; }
  </style>

  <!-- Light square base -->
  <rect width="8" height="8" fill="#E2B38D"/>

  <!-- Dark squares -->
  <rect x="1" y="0" width="1" height="1" fill="#A88261"/>
  <rect x="3" y="0" width="1" height="1" fill="#A88261"/>
  <rect x="5" y="0" width="1" height="1" fill="#A88261"/>
  <rect x="7" y="0" width="1" height="1" fill="#A88261"/>

  <rect x="0" y="1" width="1" height="1" fill="#A88261"/>
  <rect x="2" y="1" width="1" height="1" fill="#A88261"/>
  <rect x="4" y="1" width="1" height="1" fill="#A88261"/>
  <rect x="6" y="1" width="1" height="1" fill="#A88261"/>

  <rect x="1" y="2" width="1" height="1" fill="#A88261"/>
  <rect x="3" y="2" width="1" height="1" fill="#A88261"/>
  <rect x="5" y="2" width="1" height="1" fill="#A88261"/>
  <rect x="7" y="2" width="1" height="1" fill="#A88261"/>

  <rect x="0" y="3" width="1" height="1" fill="#A88261"/>
  <rect x="2" y="3" width="1" height="1" fill="#A88261"/>
  <rect x="4" y="3" width="1" height="1" fill="#A88261"/>
  <rect x="6" y="3" width="1" height="1" fill="#A88261"/>

  <rect x="1" y="4" width="1" height="1" fill="#A88261"/>
  <rect x="3" y="4" width="1" height="1" fill="#A88261"/>
  <rect x="5" y="4" width="1" height="1" fill="#A88261"/>
  <rect x="7" y="4" width="1" height="1" fill="#A88261"/>

  <rect x="0" y="5" width="1" height="1" fill="#A88261"/>
  <rect x="2" y="5" width="1" height="1" fill="#A88261"/>
  <rect x="4" y="5" width="1" height="1" fill="#A88261"/>
  <rect x="6" y="5" width="1" height="1" fill="#A88261"/>

  <rect x="1" y="6" width="1" height="1" fill="#A88261"/>
  <rect x="3" y="6" width="1" height="1" fill="#A88261"/>
  <rect x="5" y="6" width="1" height="1" fill="#A88261"/>
  <rect x="7" y="6" width="1" height="1" fill="#A88261"/>

  <rect x="0" y="7" width="1" height="1" fill="#A88261"/>
  <rect x="2" y="7" width="1" height="1" fill="#A88261"/>
  <rect x="4" y="7" width="1" height="1" fill="#A88261"/>
  <rect x="6" y="7" width="1" height="1" fill="#A88261"/>

  <!-- Pulse overlay -->
  <rect class="shimmer" width="8" height="8" fill="white"/>
</svg>
